name: Gerar APK Android via Capacitor - Barbearia

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código do repositório para a máquina virtual
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # 2. Configurar o ambiente Node.js
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Configurar Java JDK 17 (Necessário para a compilação Android)
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Instalar dependências do projeto e gerador de ícones
      - name: Instalar Dependências
        run: |
          npm install
          npm install -g @capacitor/assets

      # 5. Configurar Projeto Nativo, Permissões e Correção de Tema/Cache
      - name: Configurar Projeto Nativo e Ajustes de Código
        run: |
          mkdir -p www

          # Se o executável gradlew NÃO existir dentro de android/, recria a estrutura nativa
          if [ ! -f "android/gradlew" ]; then
            echo "Ficheiro gradlew não encontrado. Gerando projeto Android completo..."
            rm -rf android
            npx cap add android
          fi

          # Sincroniza os ficheiros Web com o projeto nativo
          npx cap sync android

          # Permissões do Microfone e Serviços em Segundo Plano no AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
              sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" \/>' "$MANIFEST"
            fi
          fi

          # Localiza dinamicamente o ficheiro MainActivity.java
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")

          if [ -f "$MAIN_ACTIVITY" ]; then
            # Importa a biblioteca WebSettings se necessário
            grep -q "android.webkit.WebSettings" "$MAIN_ACTIVITY" || sed -i '/import com.getcapacitor.BridgeActivity;/i import android.webkit.WebSettings;' "$MAIN_ACTIVITY"

            # Injeta limpeza de cache e desativa o modo escuro forçado
            if ! grep -q "clearCache" "$MAIN_ACTIVITY"; then
              sed -i '/super.onCreate(savedInstanceState);/a \        this.bridge.getWebView().clearCache(true);\n        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) { this.bridge.getWebView().getSettings().setForceDark(WebSettings.FORCE_DARK_OFF); }' "$MAIN_ACTIVITY"
            fi
          fi

          # Gera ícones nativos caso exista o ficheiro assets/icon.png
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android || true
          fi

      # 6. Compilar o APK Android usando o Gradle
      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Disponibilizar o APK para Download no GitHub
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Agendamento-LB-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
