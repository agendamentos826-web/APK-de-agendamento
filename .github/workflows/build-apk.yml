name: Gerar APK Android via Capacitor - Barbearia

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código do repositório
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # 2. Configurar o ambiente Node.js 22
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Configurar Java JDK 17
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Instalar dependências declaradas no package.json
      - name: Instalar Dependências
        run: |
          npm install
          npm install -g @capacitor/assets || true

      # 5. Preparar pasta WWW e Sincronizar Plugins Nativo
      - name: Sincronizar Capacitor e Gerar Recursos
        run: |
          mkdir -p www

          # Recria a estrutura nativa do Android caso não exista
          if [ ! -f "android/gradlew" ]; then
            echo "Recriando pasta nativa do Android..."
            rm -rf android
            npx cap add android
          fi

          # Sincroniza a pasta www e os plugins (StatusBar) com o Android
          npx cap sync android

          # Gera ícones nativos para todas as resoluções Android
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android || true
          fi

      # 6. Compilar o APK Android
      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Disponibilizar o APK para Download
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Agendamento LB
          path: android/app/build/outputs/apk/debug/app-debug.apk