name: Gerar APK Android via Capacitor

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código do repositório
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      # 2. Configurar o ambiente Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Configurar Java para compilar o APK Android
      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Instalar as dependências do Capacitor
      - name: Instalar Dependências
        run: npm install

      # 5. Adicionar a plataforma Android
      - name: Inicializar Projeto Android
        run: |
          mkdir -p www
          npx cap add android

      # 6. Compilar o arquivo APK usando Gradle
      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Disponibilizar o APK gerado para Download
      - name: Enviar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: Agendamento LB
          path: android/app/build/outputs/apk/debug/app-debug.apk
