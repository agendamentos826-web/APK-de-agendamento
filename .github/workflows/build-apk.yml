name: Gerar APK Android via Capacitor

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código do repositório
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # 2. Configurar o ambiente Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Configurar o Java 17 para compilação Android
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Instalar as dependências e a ferramenta de Ícones
      - name: Instalar Dependências e Gerador de Ícones
        run: |
          npm install
          npm install -g @capacitor/assets

      # 5. Gerar projeto Android, Injetar Permissão de Microfone e Gerar Ícones
      - name: Configurar Projeto Nativo
        run: |
          mkdir -p www
          npx cap add android
          # Permissão de Microfone
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>' android/app/src/main/AndroidManifest.xml
          # Gerar os ícones do App se a imagem icon.png existir
          if [ -f "icon.png" ]; then
            npx capacitor-assets generate --android
          fi

      # 6. Compilar o APK
      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Disponibilizar o APK para Download
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Agendamento LB
          path: android/app/build/outputs/apk/debug/app-debug.apk
