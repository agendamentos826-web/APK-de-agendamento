name: Gerar APK Android via Capacitor

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código do repositório
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # 2. Configurar o ambiente Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Configurar Java 17 para compilação Android
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Instalar dependências e gerador de assets
      - name: Instalar Dependências e Ferramenta de Ícones
        run: |
          npm install
          npm install -g @capacitor/assets

      # 5. Inicializar projeto Android e Injetar Permissões
      - name: Configurar Projeto Nativo e Ícones
        run: |
          mkdir -p www
          npx cap add android

          # Injeta permissões de Áudio e Serviço de Segundo Plano no AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" \/>' android/app/src/main/AndroidManifest.xml

          # Verifica se a imagem existe na pasta assets/ e gera os ícones do App
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android
          fi

      # 6. Compilar o APK Android
      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Disponibilizar o APK para Download
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Agendamento LB
          path: android/app/build/outputs/apk/debug/app-debug.apk
