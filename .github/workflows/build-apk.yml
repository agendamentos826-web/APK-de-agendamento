name: Gerar APK Android via Capacitor - Barbearia

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código do repositório
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # 2. Configurar o ambiente Node.js 20
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Configurar Java JDK 17
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Instalar dependências
      - name: Instalar Dependências
        run: |
          npm install
          npm install -g @capacitor/assets || true

      # 5. Criar pasta WWW de suporte e Sincronizar
      - name: Preparar Pasta WWW e Sincronizar Capacitor
        run: |
          # Garante que a pasta www existe
          mkdir -p www
          
          # Cria um index.html basico apenas para o Capacitor nao dar erro de pasta vazia
          echo '<!DOCTYPE html><html><head><title>Agendamento LB</title></head><body></body></html>' > www/index.html

          # Se o executavel gradlew NAO existir, recria a estrutura nativa
          if [ ! -f "android/gradlew" ]; then
            echo "Estrutura nativa não encontrada. Gerando pasta android..."
            rm -rf android
            npx cap add android
          fi

          # Sincroniza o capacitor.config.json (Barra de status e URL do Render) com o Android
          npx cap sync android

          # Gera ícones nativos caso exista assets/icon.png
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android || true
          fi

      # 6. Compilar o APK Android usando o Gradle
      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Disponibilizar o APK para Download
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Agendamento-LB-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk