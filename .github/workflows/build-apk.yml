name: Gerar APK Android via Capacitor

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código do repositório
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # 2. Configurar o ambiente Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Configurar Java 17 para compilação Android
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Instalar dependências e gerador de ícones
      - name: Instalar Dependências e Ferramenta de Ícones
        run: |
          npm install
          npm install -g @capacitor/assets

      # 5. Criar projeto nativo, injetar permissões e FORÇAR LIMPEZA DE CACHE
      - name: Configurar Projeto Nativo e Limpeza de Cache
        run: |
          mkdir -p www
          npx cap add android

          # Permissões de Microfone e Segundo Plano
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" \/>' android/app/src/main/AndroidManifest.xml

          # Injeta comando Java para o WebView LIMPAR O CACHE ao iniciar
          MAIN_ACTIVITY="android/app/src/main/java/com/barbearia/lucasborges/MainActivity.java"
          sed -i '/this.init(savedInstanceState, new ArrayList<Class<? extends Plugin>>() {{/a \    this.bridge.getWebView().clearCache(true);' $MAIN_ACTIVITY || true

          # Gerar ícones se a imagem existir
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android
          fi

      # 6. Compilar o APK
      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Disponibilizar o APK para Download
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Agendamento LB
          path: android/app/build/outputs/apk/debug/app-debug.apk
